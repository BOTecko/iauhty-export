[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "iauhty-export"
version = "0.1.0"
description = "Recover Authy TOTP secrets from an encrypted iPhone backup and export them as a password-protected Aegis vault (Aegis, Proton Authenticator and other compatible apps)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []
keywords = ["authy", "totp", "2fa", "ios-backup", "aegis", "proton-authenticator", "authenticator-migration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Security :: Cryptography",
    "Topic :: Utilities",
]

[project.scripts]
iauhty-export = "iauhty_export.cli:main"

[tool.setuptools]
packages = ["iauhty_export"]
